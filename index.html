<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0ede6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="页匣">
  <meta name="description" content="把单文件 HTML 收进一块随时可以打开的私人应用桌面。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>页匣</title>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <main id="app" class="shell is-loading">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M12 8.5h18l7 7V39.5H12z"/>
          <path d="M30 8.5v7h7M18 23h13M18 29h9"/>
        </svg>
        <div>
          <h1>页匣</h1>
          <p>PRIVATE HTML DESK</p>
        </div>
      </div>
      <button id="settingsButton" class="round-button" type="button" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19 13.4v-2.8l-2-.6a7 7 0 0 0-.7-1.6l1-1.8-2-2-1.8 1a7 7 0 0 0-1.6-.7L11.3 3H8.5L8 5a7 7 0 0 0-1.6.7l-1.8-1-2 2 1 1.8A7 7 0 0 0 3 10.1l-2 .6v2.8l2 .6a7 7 0 0 0 .7 1.6l-1 1.8 2 2 1.8-1a7 7 0 0 0 1.6.7l.6 2h2.8l.6-2a7 7 0 0 0 1.6-.7l1.8 1 2-2-1-1.8a7 7 0 0 0 .7-1.6Z" transform="translate(2 0) scale(.83)"/></svg>
      </button>
    </header>

    <section class="hero">
      <div>
        <p id="dateLabel" class="eyebrow"></p>
        <h2>今天打开<br><span>哪一页？</span></h2>
      </div>
      <button id="addHeroButton" class="add-orbit" type="button" aria-label="添加 HTML">
        <span></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </section>

    <section class="library" aria-labelledby="libraryTitle">
      <div class="library-head">
        <div>
          <h3 id="libraryTitle">我的应用</h3>
          <span id="appCount">0 ITEMS</span>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="searchInput" type="search" placeholder="搜索" autocomplete="off">
        </label>
      </div>

      <div id="appGrid" class="app-grid" aria-live="polite"></div>

      <button id="emptyState" class="empty-state" type="button" hidden>
        <span class="empty-fold"><i></i></span>
        <strong>这里还空着</strong>
        <small>放进第一份 HTML，它会成为一个小应用。</small>
      </button>
    </section>
  </main>

  <button id="floatingAdd" class="floating-add" type="button" aria-label="添加 HTML">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <section id="loginScreen" class="login-screen" hidden>
    <div class="login-card">
      <svg class="login-mark" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M12 8.5h18l7 7V39.5H12z"/>
        <path d="M30 8.5v7h7M18 23h13M18 29h9"/>
      </svg>
      <p class="eyebrow">PRIVATE HTML DESK</p>
      <h2 id="loginTitle">打开页匣</h2>
      <p id="loginDescription">输入只属于你的访问密码。</p>
      <form id="loginForm">
        <div class="password-field">
          <label class="sr-only" for="passwordInput">访问密码</label>
          <input id="passwordInput" type="password" placeholder="访问密码" autocomplete="current-password" required>
          <button id="showPassword" type="button" aria-label="显示密码">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg>
          </button>
        </div>
        <p id="loginError" class="form-error" aria-live="polite"></p>
        <button id="loginSubmit" class="primary-button" type="submit">进入</button>
      </form>
    </div>
  </section>

  <div id="scrim" class="scrim" hidden></div>

  <section id="editorSheet" class="sheet" aria-modal="true" role="dialog" aria-labelledby="editorTitle" hidden>
    <div class="sheet-handle"></div>
    <header class="sheet-head">
      <button class="text-button" data-close-sheet type="button">取消</button>
      <h2 id="editorTitle">放入新应用</h2>
      <button id="saveButton" class="text-button strong" type="button">保存</button>
    </header>
    <div class="sheet-body">
      <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden>
      <button id="uploadZone" class="upload-zone" type="button">
        <span class="upload-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M5 13v6h14v-6"/></svg>
        </span>
        <span><strong>选择 HTML 文件</strong><small>单文件，最大 2 MB</small></span>
      </button>

      <div class="divider"><span>或直接粘贴代码</span></div>

      <label class="field">
        <span>应用名称</span>
        <input id="titleInput" type="text" maxlength="80" placeholder="会自动读取 &lt;title&gt;">
      </label>

      <label class="field">
        <span>一句备注 <i>可选</i></span>
        <input id="subtitleInput" type="text" maxlength="120" placeholder="这个小应用是做什么的">
      </label>

      <label class="field code-field">
        <span>HTML</span>
        <textarea id="htmlInput" spellcheck="false" placeholder="<!doctype html>\n<html>…"></textarea>
        <small id="codeStats">0 字符</small>
      </label>
      <p id="editorError" class="form-error" aria-live="polite"></p>
    </div>
  </section>

  <section id="actionsSheet" class="sheet action-sheet" aria-modal="true" role="dialog" aria-labelledby="actionTitle" hidden>
    <div class="sheet-handle"></div>
    <div class="action-app">
      <div id="actionIcon" class="mini-icon"></div>
      <div><h2 id="actionTitle">应用</h2><p id="actionSubtitle"></p></div>
    </div>
    <div class="action-list">
      <button data-action="open" type="button"><svg viewBox="0 0 24 24"><path d="M8 4H4v16h16v-4M12 4h8v8M20 4l-9 9"/></svg><span>打开应用</span></button>
      <button data-action="edit" type="button"><svg viewBox="0 0 24 24"><path d="m4 16-.7 4.7L8 20l11-11-4-4L4 16ZM13.5 6.5l4 4"/></svg><span>编辑</span></button>
      <button data-action="share" type="button"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/></svg><span>分享 HTML</span></button>
      <button data-action="download" type="button"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 11.5 12 16l4.5-4.5M4 20h16"/></svg><span>下载 HTML</span></button>
      <button data-action="delete" class="danger" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span>删除应用</span></button>
    </div>
  </section>

  <section id="settingsSheet" class="sheet action-sheet" aria-modal="true" role="dialog" aria-labelledby="settingsTitle" hidden>
    <div class="sheet-handle"></div>
    <header class="settings-title"><p class="eyebrow">PAGE VAULT</p><h2 id="settingsTitle">设置</h2></header>
    <div class="settings-list">
      <button id="installButton" type="button"><span><strong>安装到主屏幕</strong><small>像普通 App 一样打开页匣</small></span><i>›</i></button>
      <div class="setting-row"><span><strong>外观</strong><small>跟随设备，也可以手动切换</small></span><div class="theme-switch" role="group" aria-label="外观"><button type="button" data-theme="system">自动</button><button type="button" data-theme="light">浅色</button><button type="button" data-theme="dark">深色</button></div></div>
      <button id="logoutButton" type="button"><span><strong>锁上页匣</strong><small>下次打开需要重新输入密码</small></span><i>›</i></button>
    </div>
  </section>

  <section id="installSheet" class="sheet compact-sheet" aria-modal="true" role="dialog" aria-labelledby="installTitle" hidden>
    <div class="sheet-handle"></div>
    <h2 id="installTitle">放到主屏幕</h2>
    <ol class="install-steps">
      <li><span>1</span><p>使用 Safari 打开当前页面。</p></li>
      <li><span>2</span><p>点底部工具栏的“分享”。</p></li>
      <li><span>3</span><p>选择“添加到主屏幕”。</p></li>
    </ol>
  </section>

  <section id="viewer" class="viewer" hidden>
    <header class="viewer-bar">
      <button id="closeViewer" type="button" aria-label="返回页匣"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
      <div><strong id="viewerTitle"></strong><small id="viewerMode">沙盒运行</small></div>
      <button id="viewerMore" type="button" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </header>
    <iframe id="appFrame" title="HTML 应用预览" sandbox="allow-scripts allow-forms allow-modals allow-downloads allow-popups"></iframe>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js" type="module"></script>
</body>
</html>
